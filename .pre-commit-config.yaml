# Hooks run the tool versions pinned in uv.lock.
# Install once with: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock is up to date
        entry: uv lock --check
        language: system
        files: (^|/)pyproject\.toml$|^uv\.lock$
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: scripts/typecheck.sh
        language: system
        types: [python]
        pass_filenames: false
