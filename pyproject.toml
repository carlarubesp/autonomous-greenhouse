[project]
name = "autonomous-greenhouse"
version = "0.1.0"
description = "Autonomous greenhouse controller built on the MAPE-K loop."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "analyzer",
    "executor",
    "knowledge",
    "managed-resources",
    "monitor",
    "planner",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "ruff>=0.17.6",
    "types-requests>=2.33.0.20261030",
]

[tool.ruff]
target-version = "py312"
line-length = 88
# Each service runs as a script from its own folder, so its sibling modules
# are first-party imports.
src = [
    "analyzer",
    "executor",
    "knowledge",
    "managed-resources",
    "monitor",
    "planner",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]

[tool.mypy]
python_version = "3.12"
# Services are folders of scripts, not installable packages: module names are
# resolved from each service folder (see scripts/typecheck.sh).
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
# Permissive for now: untyped functions are allowed and not checked in depth.
# Strictness increases as the services gain type annotations.
check_untyped_defs = false
disallow_untyped_defs = false
