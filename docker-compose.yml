services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - greenhouse-net

  knowledge:
    build: ./knowledge
    ports:
      - "5000:5000"
    volumes:
      - ./greenhouse.conf:/greenhouse.conf
      - ./thresholds.json:/thresholds.json
    environment:
      KNOWLEDGE_PORT: 5000
    depends_on:
      - mosquitto
    restart: on-failure
    networks:
      - greenhouse-net

  monitor:
    build: ./monitor
    volumes:
      - ./greenhouse.conf:/greenhouse.conf
      - ./thresholds.json:/thresholds.json
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      KNOWLEDGE_HOST: knowledge
      KNOWLEDGE_PORT: 5000
    depends_on:
      - mosquitto
      - knowledge
    restart: on-failure
    networks:
      - greenhouse-net

  analyzer:
    build: ./analyzer
    volumes:
      - ./greenhouse.conf:/greenhouse.conf
      - ./thresholds.json:/thresholds.json
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      KNOWLEDGE_HOST: knowledge
      KNOWLEDGE_PORT: 5000
    depends_on:
      - mosquitto
      - knowledge
    restart: on-failure
    networks:
      - greenhouse-net

  planner:
    build: ./planner
    volumes:
      - ./greenhouse.conf:/greenhouse.conf
      - ./thresholds.json:/thresholds.json
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      KNOWLEDGE_HOST: knowledge
      KNOWLEDGE_PORT: 5000
    depends_on:
      - mosquitto
      - knowledge
    restart: on-failure
    networks:
      - greenhouse-net

  executor:
    build: ./executor
    volumes:
      - ./greenhouse.conf:/greenhouse.conf
      - ./thresholds.json:/thresholds.json
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      KNOWLEDGE_HOST: knowledge
      KNOWLEDGE_PORT: 5000
    depends_on:
      - mosquitto
      - knowledge
    restart: on-failure
    networks:
      - greenhouse-net

  simulator:
    build: ./managed-resources
    volumes:
      - ./greenhouse.conf:/greenhouse.conf
      - ./thresholds.json:/thresholds.json
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
    depends_on:
      - mosquitto
    restart: on-failure
    networks:
      - greenhouse-net

networks:
  greenhouse-net:
    driver: bridge