services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - greenhouse-net

  knowledge:
    build:
      context: .
      dockerfile: knowledge/Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./greenhouse.conf:/greenhouse.conf
      - ./thresholds.json:/thresholds.json
    environment:
      KNOWLEDGE_PORT: 5000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      - mosquitto
    restart: on-failure
    networks:
      - greenhouse-net

  monitor:
    build:
      context: .
      dockerfile: monitor/Dockerfile
    volumes:
      - ./greenhouse.conf:/greenhouse.conf
      - ./thresholds.json:/thresholds.json
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      KNOWLEDGE_HOST: knowledge
      KNOWLEDGE_PORT: 5000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      - mosquitto
      - knowledge
    restart: on-failure
    networks:
      - greenhouse-net

  analyzer:
    build:
      context: .
      dockerfile: analyzer/Dockerfile
    volumes:
      - ./greenhouse.conf:/greenhouse.conf
      - ./thresholds.json:/thresholds.json
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      KNOWLEDGE_HOST: knowledge
      KNOWLEDGE_PORT: 5000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      - mosquitto
      - knowledge
    restart: on-failure
    networks:
      - greenhouse-net

  planner:
    build:
      context: .
      dockerfile: planner/Dockerfile
    volumes:
      - ./greenhouse.conf:/greenhouse.conf
      - ./thresholds.json:/thresholds.json
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      KNOWLEDGE_HOST: knowledge
      KNOWLEDGE_PORT: 5000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      - mosquitto
      - knowledge
    restart: on-failure
    networks:
      - greenhouse-net

  executor:
    build:
      context: .
      dockerfile: executor/Dockerfile
    volumes:
      - ./greenhouse.conf:/greenhouse.conf
      - ./thresholds.json:/thresholds.json
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      KNOWLEDGE_HOST: knowledge
      KNOWLEDGE_PORT: 5000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      - mosquitto
      - knowledge
    restart: on-failure
    networks:
      - greenhouse-net

  simulator:
    build:
      context: .
      dockerfile: managed-resources/Dockerfile
    volumes:
      - ./greenhouse.conf:/greenhouse.conf
      - ./thresholds.json:/thresholds.json
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      - mosquitto
    restart: on-failure
    networks:
      - greenhouse-net

networks:
  greenhouse-net:
    driver: bridge